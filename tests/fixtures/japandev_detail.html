 propose system changes.\u003C/li>\n  \u003Cli>Manage and improve the CI infrastructure and tools.\u003C/li>\n  \u003Cli>Ensure good coding practices and code quality through consistent code reviews.\u003C/li>\n  \u003Cli>Collaborate with other engineering teams to improve and optimize the CI tools.\u003C/li>\n\u003C/ul>\n\u003Cp> \u003C/p>\n\u003Cp>\u003Cstrong>Minimum Requirements\u003C/strong>\u003C/p>\n\u003Cul>\n  \u003Cli>Understanding of C/C++ compilation processes and build tools (such as CMake).\u003C/li>\n  \u003Cli>Experience integrating and operating build systems within CI/CD pipelines.\u003C/li>\n  \u003Cli>Proficiency in at least one programming language used for internal tooling (Python or Go).\u003C/li>\n  \u003Cli>Working knowledge of Bash scripting and Linux administration (Debian preferred).\u003C/li>\n  \u003Cli>Experience operating containerized environments (such as Docker, k8s, etc).\u003C/li>\n  \u003Cli>Proficiency with Git version control and collaborative branching workflows.\u003C/li>\n  \u003Cli>Experience in planning and executing infrastructure projects or system migrations.\u003C/li>\n\u003C/ul>\n\u003Cp> \u003C/p>\n\u003Cp>\u003Cstrong>Preferred Requirements\u003C/strong>\u003C/p>\n\u003Cul>\n  \u003Cli>Hands-on experience with Bazel, JHbuild, or Gnome build tools, or building complex, distributed build systems.\u003C/li>\n  \u003Cli>Knowledge of package management systems across multiple languages (Python, C++, Rust, or JavaScript).\u003C/li>\n  \u003Cli>Experience with Kubernetes\u003C/li>\n  \u003Cli>Experience writing technical proposals and design specifications.\u003C/li>\n  \u003Cli>Familiarity with Agile software development.\u003C/li>\n\u003C/ul>\n\u003Cp> \u003C/p>\n\u003Cp>\u003Cstrong>Interview Process:\u003C/strong>\u003C/p>\n\u003Cul>\n  \u003Cli>Resume Screening\u003C/li>\n  \u003Cli>Take-home coding test\u003C/li>\n  \u003Cli>HR interview\u003C/li>\n  \u003Cli>Technical interview\u003C/li>\n  \u003Cli>Culture/Team fi
